<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Form Example</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow-sm p-4">
    <h3 class="mb-4 text-primary">Registration Form</h3>

    <form id="myForm">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" class="form-control" placeholder="Enter your name">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email">
      </div>

      <div class="mb-3">
        <label for="city" class="form-label">City</label>
        <input type="text" id="city" class="form-control" placeholder="Enter your city">
      </div>

      <button type="button" class="btn btn-primary w-100" onclick="submitForm()">Submit</button>
    </form>

    <div class="mt-4">
      <h5>Submitted Data:</h5>
      <div id="output" class="border p-3 bg-white rounded"></div>
    </div>
  </div>
</div>

<script>
function submitForm() {
  // Get input values
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const city = document.getElementById("city").value.trim();

  // Simple validation
  if (!name || !email || !city) {
    alert("Please fill in all fields!");
    return;
  }

  // Create a new div for this submission
  const newEntry = document.createElement("div");
  newEntry.classList.add("border", "p-3", "bg-white", "rounded", "mb-2");
  newEntry.innerHTML = `
    <strong>Name:</strong> ${name}<br>
    <strong>Email:</strong> ${email}<br>
    <strong>City:</strong> ${city}
  `;

  // Append new entry to output instead of replacing
  document.getElementById("output").appendChild(newEntry);

  // Clear the form
  document.getElementById("myForm").reset();
}
</script>

</body>
</html>
