<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Form Example</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow-sm p-4">
    <h3 class="mb-4 text-primary">Registration Form</h3>

    <form id="myForm">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" class="form-control" placeholder="Enter your name">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter your email">
      </div>

      <div class="mb-3">
        <label for="city" class="form-label">City</label>
        <input type="text" id="city" class="form-control" placeholder="Enter your city">
      </div>

      <button type="button" class="btn btn-primary w-100" onclick="submitForm()">Submit</button>
    </form>

    <div class="mt-4">
      <h5>Submitted Data:</h5>
      <div id="output"></div>
    </div>
  </div>
</div>

<script>
window.onload = loadData;   // load existing data on page open

function submitForm() {
  const name  = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const city  = document.getElementById("city").value.trim();

  if (!name || !email || !city) {
    alert("Please fill in all fields!");
    return;
  }

  // Retrieve existing data from localStorage (or empty array)
  let records = JSON.parse(localStorage.getItem("registrations")) || [];

  // Add new record
  records.push({ name, email, city });

  // Save back to localStorage
  localStorage.setItem("registrations", JSON.stringify(records));

  // Show on screen
  displayRecord(name, email, city);

  document.getElementById("myForm").reset();
}

function loadData() {
  let records = JSON.parse(localStorage.getItem("registrations")) || [];
  for (const r of records) {
    displayRecord(r.name, r.email, r.city);
  }
}

function displayRecord(name, email, city) {
  const entry = document.createElement("div");
  entry.classList.add("border", "p-3", "bg-white", "rounded", "mb-2");
  entry.innerHTML = `
    <strong>Name:</strong> ${name}<br>
    <strong>Email:</strong> ${email}<br>
    <strong>City:</strong> ${city}
  `;
  document.getElementById("output").appendChild(entry);
}
</script>

</body>
</html>
